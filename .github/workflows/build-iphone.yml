# The iPhone app alone, from the branch its work is done on (the user, 2026-11-25: "iPhone-only branch builds"): built
# and checked in the simulator as build-apps.yml's iPhone job does, the Cluster app with its own Python (this iPhone as
# a member of the cluster: ClusterMember.swift), and published nowhere: its .ipa files are this run's artifacts only.
# main, and the devices that update from its "Latest build" release, get the work once it works here.
name: Build the iPhone app (branch)

on:
  push:
    branches: [iphone-member]
  workflow_dispatch:

concurrency:
  group: build-iphone
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # (No install scripts: the iPhone app needs neither Electron nor ffmpeg.)
      - run: npm ci --ignore-scripts

      - name: Build the web app into the iPhone app
        run: |
          node scripts/build-web.js 2>&1 | tee ios-build.log
          npx cap sync ios 2>&1 | tee -a ios-build.log

      # BeeWare's Python 3.13 for iOS (b18, its SHA-256 checked), the Cluster app's own Python.
      - name: Python for iOS
        run: |
          curl -fsSL -o python-ios.tar.gz https://github.com/beeware/Python-Apple-support/releases/download/3.13-b18/Python-3.13-iOS-support.b18.tar.gz
          echo "d06acf2a9c7964a8689566353a0e707402eff822037de5e29ba0e16040f7047d  python-ios.tar.gz" | shasum -a 256 -c
          mkdir -p python-ios
          tar -xzf python-ios.tar.gz -C python-ios
          test -d python-ios/Python.xcframework/ios-arm64/Python.framework

      # FFmpeg 8.0 with x264 for iOS, the Cluster app's own ffmpeg (scripts/build-ffmpeg-ios.sh: ClusterFFmpeg.framework
      # for iPhones and the simulator), kept in the Actions cache as soon as it's built, while its script is the same.
      - id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ffmpeg-ios
          key: ffmpeg-ios-${{ hashFiles('scripts/build-ffmpeg-ios.sh', 'ios/ffmpeg/**') }}
      - name: FFmpeg for iOS
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          command -v pkg-config > /dev/null || brew install pkgconf
          bash scripts/build-ffmpeg-ios.sh build/ffmpeg-ios
      - if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ffmpeg-ios
          key: ffmpeg-ios-${{ hashFiles('scripts/build-ffmpeg-ios.sh', 'ios/ffmpeg/**') }}

      # The animal model's tools in the Cluster app: NumPy and Pillow for its Python (scripts/get-ios-wheels.sh: iOS
      # wheels, each checked against its SHA-256), and ONNX Runtime 1.27.0 for iOS with the app's own way in
      # (scripts/build-ort-ios.sh: ClusterORT.framework, from Microsoft's package, its SHA-512 checked), kept in the
      # Actions cache once built, while its script is the same.
      - name: NumPy and Pillow for iOS
        run: bash scripts/get-ios-wheels.sh build/ios-wheels
      - id: ort-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ort-ios
          key: ort-ios-${{ hashFiles('scripts/build-ort-ios.sh', 'ios/ort/**') }}
      - name: ONNX Runtime for iOS
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ort-ios.sh build/ort-ios
      - if: steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ort-ios
          key: ort-ios-${{ hashFiles('scripts/build-ort-ios.sh', 'ios/ort/**') }}

      # Its own Transmission, for the cluster's downloads (scripts/build-transmission-ios.sh: libtransmission 4.1.4 with
      # curl and mbedTLS, as the Android app's, ClusterTransmission.framework), kept in the Actions cache once built.
      - id: transmission-cache
        uses: actions/cache/restore@v4
        with:
          path: build/transmission-ios
          key: transmission-ios-${{ hashFiles('scripts/build-transmission-ios.sh', 'ios/transmission/**') }}
      - name: Transmission for iOS
        if: steps.transmission-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-transmission-ios.sh build/transmission-ios
      - if: steps.transmission-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/transmission-ios
          key: transmission-ios-${{ hashFiles('scripts/build-transmission-ios.sh', 'ios/transmission/**') }}

      # Its own libtorrent, for a big download's pieces (scripts/build-libtorrent-ios.sh: libtorrent 2.0.16 with Boost's
      # headers and the part-runner both phone apps share, ClusterPieces.framework), kept in the Actions cache once built.
      - id: libtorrent-cache
        uses: actions/cache/restore@v4
        with:
          path: build/libtorrent-ios
          key: libtorrent-ios-${{ hashFiles('scripts/build-libtorrent-ios.sh', 'ios/pieces/**', 'cluster/pieces-native/**') }}
      - name: libtorrent for iOS
        if: steps.libtorrent-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-libtorrent-ios.sh build/libtorrent-ios
      - if: steps.libtorrent-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/libtorrent-ios
          key: libtorrent-ios-${{ hashFiles('scripts/build-libtorrent-ios.sh', 'ios/pieces/**', 'cluster/pieces-native/**') }}

      # Started now: a simulator's first start takes minutes, done while the app builds.
      - name: Start the simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "SIM=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-sim CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee -a ios-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/ios-sim/Build/Products/Debug-iphonesimulator/App.app

      # Cluster in the simulator, with its own Python: a Pi simulated here (cluster/node), reached through the app's
      # Cluster plugin; then the app's member service started beside it and asked through that Pi, its ffmpeg, and the
      # animal model's tools, its own Transmission and its FTP link to the Pi's shared folder (cluster.js's self-test, in the
      # app's log as HT-SELFTEST).
      # The simulated Pi on Python 3.11, as Pi OS's own: pyftpdlib (its FTP link) is built on Python's asyncore, which
      # Python 3.12 dropped (newer Pythons need two more packages for it), and the runner's own Python is newer. Kept off
      # the PATH: only the simulated Pi uses it.
      - id: pi-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          update-environment: false

      - name: Check Cluster in the simulator
        timeout-minutes: 30
        run: |
          udid="$SIM"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          # (the simulated Pi's FTP link, for the app's: pyftpdlib 2.2.0 (its SHA-256 checked; plain Python, used where it's
          # unpacked) and a folder it shares, with a file in it)
          curl -fsSL -o pyftpdlib.tar.gz https://files.pythonhosted.org/packages/f9/42/8751c5f58ae59b09e070da4fa322ae9693a340d2cc456b5a380b2c1ee47a/pyftpdlib-2.2.0.tar.gz
          echo "4ba0642078792df63dd3b2e9c8f838f2a3ecf428c7518d5921c0530d53512acf  pyftpdlib.tar.gz" | shasum -a 256 -c
          tar -xzf pyftpdlib.tar.gz
          mkdir -p ftp-shared/shared
          echo 'Hello from the simulated Pi.' > ftp-shared/shared/hello.txt
          PYTHONPATH="$PWD/pyftpdlib-2.2.0" HT_CLUSTER_FTP_FOLDERS="$PWD/ftp-shared/shared" "${{ steps.pi-python.outputs.python-path }}" cluster/node/ht_cluster.py --simulate --port 47830 > cluster-sim.log 2>&1 &
          # (the simulated Pi answering before the app asks it: started in the background, it takes a few seconds)
          for i in $(seq 1 60); do curl -s -m 5 -o /dev/null -H "X-HT-Cluster: 1" http://127.0.0.1:47830/api/node && break; sleep 1; done
          node scripts/ios-variant.js build/ios-sim/Build/Products/Debug-iphonesimulator/App.app cluster build/ios-sim-cluster --python python-ios/Python.xcframework --ffmpeg build/ffmpeg-ios --ort build/ort-ios --wheels build/ios-wheels --transmission build/transmission-ios --libtorrent build/libtorrent-ios
          xcrun simctl install "$udid" build/ios-sim-cluster/App.app
          xcrun simctl launch --console-pty "$udid" com.handtracker.cluster -HTSelfTest http://127.0.0.1:8765/ > sim-cluster.log 2>&1 &
          for i in $(seq 1 300); do grep -q "HT-SELFTEST" sim-cluster.log && break; sleep 2; done
          grep -a "HT-SELFTEST" sim-cluster.log | tail -1 | tee selftest-cluster.txt
          if ! python3 -c "import json,sys; t=open('selftest-cluster.txt').read(); d=json.loads(t.split('HT-SELFTEST ',1)[1]); sys.exit(0 if d.get('ok') and (d.get('member') or {}).get('ok') and (d.get('ffmpeg') or {}).get('ok') and (d.get('animals') or {}).get('ok') and (d.get('downloads') or {}).get('ok') and (d.get('ftp') or {}).get('ok') else 1)" || ! cmp -s ftp-shared/shared/hello.txt ftp-shared/shared/sent-from-iphone.txt || ! test -d ftp-shared/shared/made-on-iphone; then
            echo "== the app's log" >> ios-build.log; tail -n 150 sim-cluster.log >> ios-build.log
            echo "== the simulated Pi's log" >> ios-build.log; tail -n 40 cluster-sim.log >> ios-build.log
            tail -n 150 sim-cluster.log
            echo "== the simulated Pi's log"; tail -n 40 cluster-sim.log
            exit 1
          fi
          echo "Cluster: its self-test passed, this iPhone's member service, its ffmpeg, the animal model's tools, its own Transmission and its FTP link included"

      - name: Build for iPhones (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 \
            | tee -a ios-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          app=build/ios/Build/Products/Release-iphoneos/App.app
          test -d "$app"
          version=$(node -p "require('./package.json').version")
          mkdir -p dist
          node scripts/ios-variant.js "$app" cluster build/ios-cluster --python python-ios/Python.xcframework --ffmpeg build/ffmpeg-ios --ort build/ort-ios --wheels build/ios-wheels --transmission build/transmission-ios --libtorrent build/libtorrent-ios
          test -f build/ios-cluster/App.app/Frameworks/Python.framework/Python
          test -f build/ios-cluster/App.app/Frameworks/numpy._core._multiarray_umath.framework/numpy._core._multiarray_umath
          test -f build/ios-cluster/App.app/Frameworks/PIL._imaging.framework/PIL._imaging
          for f in ClusterFFmpeg ClusterORT ClusterTransmission ClusterPieces Python; do lipo -archs "build/ios-cluster/App.app/Frameworks/$f.framework/$f" | grep -q arm64; done
          rm -rf Payload && mkdir Payload && cp -R build/ios-cluster/App.app Payload/
          zip -qr "dist/Cluster-$version-ios-unsigned.ipa" Payload
          ls -la dist

      - name: Why the build failed
        if: failure()
        run: |
          test -f ios-build.log || exit 0
          echo "::error title=iPhone build::$(grep -E "error:|HT-SELFTEST|Error|Traceback" ios-build.log | tail -n 40 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-branch
          path: dist/*.ipa
          if-no-files-found: error
