# Builds the Windows app (.exe), the Mac app (.dmg), the Linux app (.deb) and the Android app
# (.apk) whenever main changes, and publishes them on the "Latest build" release, replacing the
# previous build (a Mac build that fails doesn't hold up the others):
# https://github.com/alexandermulholland92/hand-tracker/releases/tag/latest-build
# Run it by hand from the Actions tab (Build apps → Run workflow) too.
name: Build apps

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: build-apps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # With install scripts: Electron and ffmpeg download their Windows binaries.
      - run: npm ci

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # With install scripts: Electron and ffmpeg download their Linux binaries.
      - run: npm ci

      - run: npm run dist:deb

      # The same for 64-bit ARM (Raspberry Pi 4 and 5): ARM Electron, and ARM ffmpeg swapped
      # in for this build (see scripts/dist.js).
      - run: npm run dist:deb-arm64

      # The package installs and removes cleanly, with the USB rule OAK cameras need
      # (build/linux/*-oak.sh) and the OAK helper where Python can read it.
      - name: Install and remove the package
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ./dist/hand-tracker_*_amd64.deb
          grep -q 'idVendor}=="03e7"' /lib/udev/rules.d/80-hand-tracker-oak.rules
          test -L /usr/bin/hand-tracker
          test -f "/opt/Hand Tracker/resources/app.asar.unpacked/oak/oak_bridge.py"
          sudo apt-get remove -y -q hand-tracker
          test ! -e /lib/udev/rules.d/80-hand-tracker-oak.rules
          echo "Installed and removed cleanly, with the OAK camera rule"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb
          if-no-files-found: error

  # The Mac app is built on a Mac, for Apple silicon and for Intel Macs, signed ad hoc (there's
  # no Apple Developer ID), so macOS asks before opening it the first time (see the README).
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # With install scripts: Electron and ffmpeg download their Mac (Apple silicon) binaries.
      - run: npm ci

      # Apple silicon, then Intel (Intel Electron, and Intel ffmpeg swapped in: scripts/dist.js).
      - run: npm run dist:mac
      - run: npm run dist:mac-x64

      # Each app is signed whole, says why it wants the camera and microphone, and carries the
      # input helper (both processors; it starts and answers) and ffmpeg for its own processor.
      - name: Check the apps
        run: |
          for dir in mac-arm64:arm64 mac:x86_64; do
            app="dist/${dir%%:*}/Hand Tracker.app"; arch="${dir##*:}"
            codesign --verify --deep --strict "$app"
            /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$app/Contents/Info.plist"
            unpacked="$app/Contents/Resources/app.asar.unpacked"
            helper="$unpacked/electron/input-helper-mac"
            archs=$(lipo -archs "$helper"); [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
            printf 'ping\npos\n' | "$helper" | tr '\n' ' ' | grep -E "^ready pong pos -?[0-9]+ -?[0-9]+ $"
            lipo -archs "$unpacked/node_modules/ffmpeg-static/ffmpeg" | grep -qx "$arch"
            test -f "$unpacked/oak/oak_bridge.py"
          done
          echo "Both Mac apps are signed, with the input helper and the right ffmpeg"

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      # Whether a signing key is saved as the repository secret ANDROID_DEBUG_KEYSTORE.
      SAVED_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Every build is signed with the same key, so each APK installs over the last one.
      # Best: a key saved as the repository secret ANDROID_DEBUG_KEYSTORE (a debug.keystore,
      # base64), kept for good; the same as a PC's key, the two install over each other too.
      - name: Signing key from the repository's secrets
        if: env.SAVED_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore

      # Without one, a key kept in the Actions cache (never the secret's: other branches can
      # read the cache), which GitHub drops after 7 days without a build; the next build then
      # makes a new key. Made here rather than left to Gradle, so the cache always has it to keep.
      - if: env.SAVED_KEY != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore
      - name: Signing key, made if there isn't one yet
        if: env.SAVED_KEY != 'true'
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # Gradle signs with that key (named, so the runner's settings can't point it elsewhere).
      # Its fingerprint goes in the log, to tell which key a build has.
      - name: Signing key in use
        run: |
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:"

      # The web bundle only copies files out of node_modules, so the install scripts
      # (Electron's and ffmpeg's desktop downloads) aren't needed.
      - run: npm ci --ignore-scripts

      # Uses the runner's Android SDK (ANDROID_HOME) and the JDK above (JAVA_HOME).
      - run: npm run android:apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [windows, linux, android, mac]
    # Published without the Mac app if only its build failed.
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build dist/* --target "$GITHUB_SHA" --prerelease --title "Latest build" \
            --notes "Built from $(echo "$GITHUB_SHA" | cut -c1-7) on main. Windows: HandTracker-*-portable.exe (no install). Mac: HandTracker-*-mac-arm64.dmg (Apple silicon) or HandTracker-*-mac-x64.dmg (Intel); the first time, open it from System Settings → Privacy & Security → Open Anyway. Linux: hand-tracker_*_amd64.deb (sudo apt install ./hand-tracker_*_amd64.deb). Raspberry Pi 4/5 and other 64-bit ARM Linux: hand-tracker_*_arm64.deb. Android: HandTracker-*.apk."
