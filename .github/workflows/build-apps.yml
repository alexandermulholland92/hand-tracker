# Builds the Windows app (.exe), the Mac app (.dmg), the Linux app (.deb), the Android app (.apk)
# and the iPhone app (.ipa, unsigned: sideloaded) whenever main changes, and publishes them on the
# "Latest build" release, replacing the previous build (a Mac or iPhone build that fails doesn't
# hold up the others):
# https://github.com/alexandermulholland92/hand-tracker/releases/tag/latest-build
# Run it by hand from the Actions tab (Build apps → Run workflow) too.
name: Build apps

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: build-apps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # With install scripts: Electron and ffmpeg download their Windows binaries.
      - run: npm ci

      - run: npm run dist

      # Hand Mouse and Remote Recording: the same app, each with its own name, ID and page
      # (scripts/dist.js --app).
      - run: node scripts/dist.js portable --app mouse
      - run: node scripts/dist.js portable --app remote

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # With install scripts: Electron and ffmpeg download their Linux binaries.
      - run: npm ci

      - run: npm run dist:deb
      # Hand Mouse and Remote Recording (scripts/dist.js --app): packages of their own.
      - run: node scripts/dist.js deb --app mouse
      - run: node scripts/dist.js deb --app remote

      # The same for 64-bit ARM (Raspberry Pi 4 and 5): ARM Electron, and ARM ffmpeg swapped
      # in for this build (see scripts/dist.js).
      - run: npm run dist:deb-arm64
      - run: node scripts/dist.js deb --arm64 --app mouse
      - run: node scripts/dist.js deb --arm64 --app remote

      # The packages install and remove cleanly, side by side: Hand Tracker with the USB rule OAK
      # cameras need (build/linux/*-oak.sh) and the OAK helper where Python can read it, Remote
      # Recording with its own OAK rule, Hand Mouse with its own virtual mouse rule; removing
      # those two leaves Hand Tracker's.
      - name: Install and remove the packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ./dist/hand-tracker_*_amd64.deb ./dist/hand-mouse_*_amd64.deb ./dist/remote-recording_*_amd64.deb
          grep -q 'idVendor}=="03e7"' /lib/udev/rules.d/80-hand-tracker-oak.rules
          test -L /usr/bin/hand-tracker
          test -f "/opt/Hand Tracker/resources/app.asar.unpacked/oak/oak_bridge.py"
          grep -q 'idVendor}=="03e7"' /lib/udev/rules.d/80-remote-recording-oak.rules
          test -L /usr/bin/remote-recording
          test -f "/opt/Remote Recording/resources/app.asar.unpacked/oak/oak_bridge.py"
          grep -q uinput /lib/udev/rules.d/70-hand-mouse-uinput.rules
          test -L /usr/bin/hand-mouse
          test -d "/opt/Hand Mouse/resources"
          sudo apt-get remove -y -q hand-mouse remote-recording
          test ! -e /lib/udev/rules.d/80-remote-recording-oak.rules
          test ! -e /lib/udev/rules.d/70-hand-mouse-uinput.rules
          test -e /lib/udev/rules.d/80-hand-tracker-oak.rules
          sudo apt-get remove -y -q hand-tracker
          test ! -e /lib/udev/rules.d/80-hand-tracker-oak.rules
          echo "Installed and removed cleanly, side by side, each with its own rules"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb
          if-no-files-found: error

  # The Mac app is built on a Mac, for Apple silicon and for Intel Macs, signed ad hoc (there's
  # no Apple Developer ID), so macOS asks before opening it the first time (see the README).
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # With install scripts: Electron and ffmpeg download their Mac (Apple silicon) binaries.
      - run: npm ci

      # Apple silicon, then Intel (Intel Electron, and Intel ffmpeg swapped in: scripts/dist.js);
      # each also as Hand Mouse and Remote Recording (scripts/dist.js --app).
      - run: npm run dist:mac 2>&1 | tee mac-build.log
      - run: node scripts/dist.js mac --app mouse 2>&1 | tee mac-build.log
      - run: node scripts/dist.js mac --app remote 2>&1 | tee mac-build.log
      - run: npm run dist:mac-x64 2>&1 | tee mac-build.log
      - run: node scripts/dist.js mac --x64 --app mouse 2>&1 | tee mac-build.log
      - run: node scripts/dist.js mac --x64 --app remote 2>&1 | tee mac-build.log

      # Each app is signed whole, has its own ID, says why it wants the camera and microphone, and
      # carries the input helper (both processors; it starts and answers) and ffmpeg for its own
      # processor.
      - name: Check the apps
        run: |
          for both in "Hand Tracker:com.handtracker.app" "Hand Mouse:com.handtracker.mouse" "Remote Recording:com.handtracker.remote"; do
          for dir in mac-arm64:arm64 mac:x86_64; do
            app="dist/${dir%%:*}/${both%%:*}.app"; arch="${dir##*:}"
            test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist")" = "${both##*:}"
            codesign --verify --deep --strict "$app"
            /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$app/Contents/Info.plist"
            unpacked="$app/Contents/Resources/app.asar.unpacked"
            helper="$unpacked/electron/input-helper-mac"
            archs=$(lipo -archs "$helper"); [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
            printf 'ping\npos\n' | "$helper" | tr '\n' ' ' | grep -E "^ready pong pos -?[0-9]+ -?[0-9]+ $"
            archs=$(lipo -archs "$unpacked/electron/bluetooth-helper-mac"); [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
            /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$app/Contents/Info.plist"
            lipo -archs "$unpacked/node_modules/ffmpeg-static/ffmpeg" | grep -qx "$arch"
            test -f "$unpacked/oak/oak_bridge.py"
          done
          done
          echo "The Mac apps (Hand Tracker, Hand Mouse, Remote Recording; Apple silicon and Intel) are signed, with the input helper and the right ffmpeg"

      # The end of a failed build's output, as an annotation on the run (anyone can read those;
      # the log needs signing in).
      - name: Why the build failed
        if: failure()
        run: |
          test -f mac-build.log || exit 0
          echo "::error title=Mac build::$(tail -n 60 mac-build.log | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.dmg
          if-no-files-found: error

  # The iPhone and iPad app (Capacitor's iOS app, ios/): built for the simulator and checked
  # there (the app launched with -HTSelfTest <test page> opens a page this job serves in its hand
  # browser and clicks its link with the hand mouse's calls), then built for iPhones, unsigned:
  # Sideloadly or AltStore sign it with the user's own Apple ID when they install it. Hand Mouse
  # and Remote Recording are made from it (scripts/ios-variant.js: their own pages, ID and name)
  # and checked in the simulator too.
  ios:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # (No install scripts: the iPhone app needs neither Electron nor ffmpeg.)
      - run: npm ci --ignore-scripts

      - name: Build the web app into the iPhone app
        run: |
          node scripts/build-web.js 2>&1 | tee ios-build.log
          npx cap sync ios 2>&1 | tee -a ios-build.log

      # Started now: a simulator's first start takes minutes, done while the app builds.
      - name: Start the simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "SIM=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-sim CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee -a ios-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/ios-sim/Build/Products/Debug-iphonesimulator/App.app

      # The hand browser in the simulator, on a test page served here (a link, and the page it
      # opens): the self-test's result is in the app's log.
      - name: Check it in the simulator
        timeout-minutes: 40
        run: |
          mkdir -p selftest-site
          echo '<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hand Tracker test</title><a href="next.html" style="display:block;margin:40px 20px;padding:40px 0;font:28px sans-serif;text-align:center;background:#def">Next page</a><div style="height:300vh"></div>' > selftest-site/index.html
          echo '<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Next page</title><p>The hand mouse clicked the link.</p>' > selftest-site/next.html
          (cd selftest-site && python3 -m http.server 8765 --bind 127.0.0.1 > ../site.log 2>&1 &)
          udid="$SIM"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl install "$udid" build/ios-sim/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch --console-pty "$udid" com.handtracker.app -HTSelfTest http://127.0.0.1:8765/ > sim.log 2>&1 &
          for i in $(seq 1 90); do grep -q "HT-SELFTEST" sim.log && break; sleep 2; done
          grep -a "HT-SELFTEST" sim.log | tail -1 | tee selftest.txt
          grep -q '"ok":true' selftest.txt || { tail -n 80 sim.log >> ios-build.log; cat site.log >> ios-build.log; exit 1; }
          echo "The hand browser opened a page and the hand mouse clicked its link"
          # Hand Mouse (its hand browser, the same check) and Remote Recording (its rig: the same
          # check, remote recording's part included).
          for kind in mouse remote; do
            node scripts/ios-variant.js build/ios-sim/Build/Products/Debug-iphonesimulator/App.app "$kind" "build/ios-sim-$kind"
            xcrun simctl install "$udid" "build/ios-sim-$kind/App.app"
            xcrun simctl launch --console-pty "$udid" "com.handtracker.$kind" -HTSelfTest http://127.0.0.1:8765/ > "sim-$kind.log" 2>&1 &
            for i in $(seq 1 90); do grep -q "HT-SELFTEST" "sim-$kind.log" && break; sleep 2; done
            grep -a "HT-SELFTEST" "sim-$kind.log" | tail -1 | tee "selftest-$kind.txt"
            grep -q '"ok":true' "selftest-$kind.txt" || { echo "== $kind" >> ios-build.log; tail -n 80 "sim-$kind.log" >> ios-build.log; exit 1; }
            echo "$kind: its self-test passed"
          done

      - name: Build for iPhones (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 \
            | tee -a ios-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          app=build/ios/Build/Products/Release-iphoneos/App.app
          test -d "$app"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$app/Info.plist"
          lipo -archs "$app/App" | grep -q arm64
          version=$(node -p "require('./package.json').version")
          mkdir -p Payload dist
          cp -R "$app" Payload/
          zip -qr "dist/HandTracker-$version-ios-unsigned.ipa" Payload
          # Hand Mouse and Remote Recording, made from it.
          for both in mouse:HandMouse remote:RemoteRecording; do
            node scripts/ios-variant.js "$app" "${both%%:*}" "build/ios-${both%%:*}"
            rm -rf Payload && mkdir Payload && cp -R "build/ios-${both%%:*}/App.app" Payload/
            zip -qr "dist/${both##*:}-$version-ios-unsigned.ipa" Payload
          done

      - name: Why the build failed
        if: failure()
        run: |
          test -f ios-build.log || exit 0
          echo "::error title=iPhone build::$(grep -E "error:|HT-SELFTEST|Error" ios-build.log | tail -n 40 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa
          if-no-files-found: error

  # The Chrome extension (the hand mouse for web pages, extension/): built, then checked in
  # Chrome for Testing with a fake camera (scripts/check-extension.js).
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node scripts/build-extension.js

      - name: Check it in Chrome for Testing
        run: |
          npm install --no-save puppeteer-core@24 @puppeteer/browsers@2
          CHROME=$(npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/cft" | tail -1 | cut -d' ' -f2-)
          CHROME="$CHROME" node scripts/check-extension.js --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*-chrome-extension.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      # Whether a signing key is saved as the repository secret ANDROID_DEBUG_KEYSTORE.
      SAVED_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Every build is signed with the same key, so each APK installs over the last one.
      # Best: a key saved as the repository secret ANDROID_DEBUG_KEYSTORE (a debug.keystore,
      # base64), kept for good; the same as a PC's key, the two install over each other too.
      - name: Signing key from the repository's secrets
        if: env.SAVED_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore

      # Without one, a key kept in the Actions cache (never the secret's: other branches can
      # read the cache), which GitHub drops after 7 days without a build; the next build then
      # makes a new key. Made here rather than left to Gradle, so the cache always has it to keep.
      - if: env.SAVED_KEY != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore
      - name: Signing key, made if there isn't one yet
        if: env.SAVED_KEY != 'true'
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # Gradle signs with that key (named, so the runner's settings can't point it elsewhere).
      # Its fingerprint goes in the log, to tell which key a build has.
      - name: Signing key in use
        run: |
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:"

      # The web bundle only copies files out of node_modules, so the install scripts
      # (Electron's and ffmpeg's desktop downloads) aren't needed.
      - run: npm ci --ignore-scripts

      # Uses the runner's Android SDK (ANDROID_HOME) and the JDK above (JAVA_HOME).
      - run: npm run android:apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [windows, linux, android, mac, ios, extension]
    # Published without the Mac or iPhone app or the Chrome extension if only their builds failed.
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build dist/* --target "$GITHUB_SHA" --prerelease --title "Latest build" \
            --notes "Built from $(echo "$GITHUB_SHA" | cut -c1-7) on main. Windows: HandTracker-*-portable.exe (no install). Mac: HandTracker-*-mac-arm64.dmg (Apple silicon) or HandTracker-*-mac-x64.dmg (Intel); the first time, open it from System Settings → Privacy & Security → Open Anyway. Linux: hand-tracker_*_amd64.deb (sudo apt install ./hand-tracker_*_amd64.deb). Raspberry Pi 4/5 and other 64-bit ARM Linux: hand-tracker_*_arm64.deb. Android: HandTracker-*.apk. iPhone and iPad: HandTracker-*-ios-unsigned.ipa, installed with Sideloadly or AltStore and your Apple ID (re-install every 7 days with a free Apple ID). Chrome (the hand mouse for web pages): HandTracker-*-chrome-extension.zip, unzipped and loaded in chrome://extensions with Developer mode on (Load unpacked). Apps of their own, for each of these the same way: Hand Mouse (the hand mouse alone): HandMouse-*; Remote Recording (controlling camera rigs, or being one): RemoteRecording-*; on Linux hand-mouse_*.deb and remote-recording_*.deb."
