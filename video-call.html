<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/png" href="favicon.png" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Video Call (an app of its own: the computer apps' "call" builds, scripts/dist.js --app call): video calls between
     your own devices over Tailscale. The page: video-call-page.js; each call set up through electron/video-call.js,
     its pictures and sound sent straight between the two apps (WebRTC). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'self'; base-uri 'none'; form-action 'none'" />
<title>Video Call</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: #0e0f12; color: #e8e8ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px;
  }
  [hidden] { display: none !important; }
  main { max-width: 1040px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  h2 { font-size: 14px; font-weight: 600; margin: 18px 0 8px; display: flex; align-items: center; gap: 10px; }
  #me { font-size: 12px; opacity: 0.55; }
  button, select {
    font: inherit; font-size: 13px; color: #e8e8ea; background: #22242b; border: 1px solid #343743;
    border-radius: 8px; padding: 6px 11px; cursor: pointer;
  }
  button:hover { background: #2a2d36; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.go { background: #2b8a3e; border-color: #37a14c; }
  button.stop { background: #c92a2a; border-color: #e03131; }
  button.on { background: #2f5fd0; border-color: #3b6ce0; }
  label { display: inline-flex; align-items: center; gap: 6px; }
  .sub { font-size: 12px; opacity: 0.55; }
  .note { font-size: 13px; opacity: 0.75; min-height: 18px; margin: 10px 0; }
  .note.err { color: #ffa8a8; opacity: 1; }
  .home { display: grid; grid-template-columns: 320px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 720px) { .home { grid-template-columns: 1fr; } }
  .preview { position: relative; aspect-ratio: 4 / 3; background: #000; border-radius: 12px; overflow: hidden; }
  .preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .preview .off { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0.6; }
  .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .choices select { max-width: 100%; }
  #devices { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  #devices li {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
    background: #17181c; border: 1px solid #2c2e36;
  }
  #devices li .name { font-weight: 600; }
  #devices li .what { font-size: 12px; opacity: 0.55; flex: 1; }
  #devices li.off { opacity: 0.5; }
  .overlay {
    position: fixed; inset: 0; background: rgba(8, 9, 11, 0.86); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; z-index: 10;
  }
  .overlay .who { font-size: 22px; font-weight: 600; }
  .overlay .row { display: flex; gap: 14px; }
  .overlay button { font-size: 16px; padding: 10px 22px; border-radius: 22px; }
  #call { position: fixed; inset: 0; background: #000; z-index: 5; }
  #remote { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #self {
    position: absolute; right: 16px; top: 16px; width: 22%; max-width: 260px; aspect-ratio: 4 / 3; object-fit: cover;
    border-radius: 10px; border: 1px solid #343743; transform: scaleX(-1); background: #111;
  }
  #remoteName { position: absolute; left: 16px; top: 14px; font-weight: 600; text-shadow: 0 1px 3px #000; }
  #remoteState { position: absolute; left: 16px; top: 38px; font-size: 13px; opacity: 0.85; text-shadow: 0 1px 3px #000; }
  .bar {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
    background: rgba(23, 24, 28, 0.85); padding: 10px 14px; border-radius: 16px; flex-wrap: wrap; justify-content: center;
  }
  #callTime { font-variant-numeric: tabular-nums; opacity: 0.7; min-width: 44px; }
  #callNote { position: absolute; left: 16px; bottom: 84px; }
</style>
</head>
<body>
<main>
  <header><h1>Video Call</h1><span id="me"></span></header>
  <p id="note" class="note"></p>
  <div class="home">
    <div>
      <div class="preview"><video id="preview" autoplay muted playsinline></video><div class="off" id="previewOff">Camera off</div></div>
      <div class="choices">
        <label>Camera <select id="camera"></select></label>
        <label>Microphone <select id="mic"></select></label>
        <label title="Video Call opens when you log in, with its window hidden, and keeps going in the background when you close its window, so your other devices can always ring it. Quit it from its icon (beside the clock) to stop calls coming in."><input type="checkbox" id="ringClosed" /> Ring when closed</label>
      </div>
    </div>
    <div>
      <h2>Your devices <button id="refresh">Refresh</button></h2>
      <ul id="devices"></ul>
      <p class="sub">Your own devices on Tailscale. One with Video Call open (or waiting in the background) can be called.</p>
    </div>
  </div>
</main>

<div class="overlay" id="ringing" hidden>
  <div class="sub">Video call from</div>
  <div class="who" id="caller"></div>
  <div class="row"><button class="go" id="answer">Answer</button><button class="stop" id="decline">Decline</button></div>
</div>
<div class="overlay" id="calling" hidden>
  <div class="sub">Calling</div>
  <div class="who" id="callee"></div>
  <div class="row"><button class="stop" id="cancel">Cancel</button></div>
</div>

<section id="call" hidden>
  <video id="remote" autoplay playsinline></video>
  <div id="remoteName"></div>
  <div id="remoteState"></div>
  <video id="self" autoplay muted playsinline></video>
  <div id="callNote" class="note"></div>
  <div class="bar">
    <span id="callTime">0:00</span>
    <button id="mute" aria-pressed="false">Mute</button>
    <button id="cameraOff" aria-pressed="false">Camera off</button>
    <select id="callCamera" title="The camera this call sends"></select>
    <button class="stop" id="hangup">Hang up</button>
  </div>
</section>

<script src="video-call-page.js"></script>
</body>
</html>
