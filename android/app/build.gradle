apply plugin: 'com.android.application'

// The Cluster app's member service (Cluster's own service run on the phone, MemberService.java) is Python: Chaquopy,
// applied only when a Cluster build is asked for (scripts/build-android.js builds that one on its own, or with
// -PclusterPython), so the other apps don't carry Python.
def clusterBuild = project.hasProperty("clusterPython") || gradle.startParameter.taskNames.any { it.toLowerCase().contains("cluster") }
if (clusterBuild) {
    apply plugin: 'com.chaquo.python'
}

android {
    namespace = "com.handtracker.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.handtracker.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.1.0"
        // (a Cluster build: Chaquopy wants every variant's chip types said, though only the Cluster app is built then)
        if (clusterBuild) {
            ndk {
                abiFilters "arm64-v8a"
            }
        }
        // The commit a GitHub build is made from (empty for one made here), in each app's manifest:
        // Cluster tells from it whether the "Latest build" release is newer (AppUpdates.java).
        def sha = System.getenv("GITHUB_SHA") ?: ""
        manifestPlaceholders = [buildCommit: (sha ==~ /[0-9a-f]{40}/) ? sha : ""]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Four apps: Hand Tracker (full), Hand Mouse (mouse: the hand mouse alone, hand-mouse.html),
    // Remote Recording (remote: remote-recording.html first) and Recording Converter (converter:
    // the Recording Converter alone, recording-converter.html first), each its own app on the
    // phone. Each has its own web files: the full app's are what Capacitor copies into
    // src/main/assets, the others' go in src/<flavor>/assets (scripts/build-android.js).
    flavorDimensions = ["app"]
    productFlavors {
        full {
            dimension "app"
        }
        mouse {
            dimension "app"
            applicationId "com.handtracker.mouse"
        }
        remote {
            dimension "app"
            applicationId "com.handtracker.remote"
        }
        converter {
            dimension "app"
            applicationId "com.handtracker.converter"
        }
        // Cluster (cluster: cluster.html first): the Raspberry Pis running Cluster's service; the phone a member
        // too (its own switch): only for 64-bit ARM phones (its Python, ffmpeg and ONNX Runtime are built for those).
        cluster {
            dimension "app"
            applicationId "com.handtracker.cluster"
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }
    sourceSets {
        main.assets.srcDirs = []
        full.assets.srcDirs = ["src/main/assets"]
        mouse.assets.srcDirs = ["src/mouse/assets"]
        remote.assets.srcDirs = ["src/remote/assets"]
        converter.assets.srcDirs = ["src/converter/assets"]
        cluster.assets.srcDirs = ["src/cluster/assets"]
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // The phone control window loads the app's own files at a secure address (WebViewAssetLoader).
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    // The Cluster app's member service: ffmpeg for its conversions (FFmpegKit, community-maintained, its GPL build: the
    // conversions' libx264 and zscale; the app is AGPL-3.0), ONNX Runtime for the animal model, Apache Commons Net for
    // the FTP link to pi's folders.
    clusterImplementation "dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.9"
    clusterImplementation "com.microsoft.onnxruntime:onnxruntime-android:1.27.0"
    clusterImplementation "commons-net:commons-net:3.13.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Python for the Cluster app's member service (Chaquopy): 3.13 (the newest with numpy and Pillow for Android phones),
// built with this computer's Python 3.13 (Chaquopy finds it: py -3.13), numpy and Pillow for the animal model's
// pictures. Its own code is assets (copied to the phone's files: the service reads its modules from its folder); only
// the small starter is Python here (src/cluster/python).
if (clusterBuild) {
    chaquopy {
        defaultConfig {
            version = "3.13"
            pip {
                install "numpy==1.26.2"
                install "pillow==11.0.0"
            }
        }
    }
}
