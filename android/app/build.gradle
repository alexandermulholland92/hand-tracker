apply plugin: 'com.android.application'

android {
    namespace = "com.handtracker.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.handtracker.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.1.0"
        // The commit a GitHub build is made from (empty for one made here), in each app's manifest:
        // Pi Cluster tells from it whether the "Latest build" release is newer (AppUpdates.java).
        def sha = System.getenv("GITHUB_SHA") ?: ""
        manifestPlaceholders = [buildCommit: (sha ==~ /[0-9a-f]{40}/) ? sha : ""]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Four apps: Hand Tracker (full), Hand Mouse (mouse: the hand mouse alone, hand-mouse.html),
    // Remote Recording (remote: remote-recording.html first) and Recording Converter (converter:
    // the Recording Converter alone, recording-converter.html first), each its own app on the
    // phone. Each has its own web files: the full app's are what Capacitor copies into
    // src/main/assets, the others' go in src/<flavor>/assets (scripts/build-android.js).
    flavorDimensions = ["app"]
    productFlavors {
        full {
            dimension "app"
        }
        mouse {
            dimension "app"
            applicationId "com.handtracker.mouse"
        }
        remote {
            dimension "app"
            applicationId "com.handtracker.remote"
        }
        converter {
            dimension "app"
            applicationId "com.handtracker.converter"
        }
        // Pi Cluster (cluster: pi-cluster.html first): the Raspberry Pis running Pi Cluster's service.
        cluster {
            dimension "app"
            applicationId "com.handtracker.cluster"
        }
    }
    sourceSets {
        main.assets.srcDirs = []
        full.assets.srcDirs = ["src/main/assets"]
        mouse.assets.srcDirs = ["src/mouse/assets"]
        remote.assets.srcDirs = ["src/remote/assets"]
        converter.assets.srcDirs = ["src/converter/assets"]
        cluster.assets.srcDirs = ["src/cluster/assets"]
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // The phone control window loads the app's own files at a secure address (WebViewAssetLoader).
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
