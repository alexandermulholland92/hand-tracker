<!doctype html>
<!-- The phone's page for remote recording (served by electron/remote-record.js while Remote
     recording is on): start and stop motion capture, each camera's status and a live preview
     of each camera. Over Tailscale it needs nothing more; on the local network, the key from
     the QR code (kept in this browser once read). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Hand Tracker remote</title>
<style>
  :root { --bg: #111216; --card: #1b1c22; --line: #2c2e36; --text: #e9ecef; --muted: #a3a9b1; --red: #e03131; --green: #2b8a3e; --err: #ff8787; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5f7; --card: #ffffff; --line: #dde0e4; --text: #1d1f23; --muted: #5f6670; --err: #c92a2a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 14px 16px 40px; }
  h1 { font-size: 18px; margin: 2px 0 4px; }
  #status { color: var(--muted); min-height: 1.45em; }
  #status.rec { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--red); margin-right: 7px; vertical-align: 1px; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
  button { flex: 1 1 150px; font: inherit; font-size: 17px; font-weight: 600; padding: 15px 16px; border: 0; border-radius: 12px; color: #fff; background: var(--green); cursor: pointer; }
  button.record { background: var(--red); }
  button.stop { background: #495057; }
  button:disabled { opacity: 0.45; cursor: default; }
  #message { color: var(--muted); font-size: 14px; min-height: 1.4em; margin-bottom: 8px; }
  #message.err { color: var(--err); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 340px) { .grid { grid-template-columns: 1fr; } }
  .cam { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .pic { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .pic span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #adb5bd; font-size: 13px; padding: 8px; text-align: center; }
  .cap { padding: 7px 10px 9px; font-size: 13px; }
  .cap b { font-size: 14px; }
  .tools { display: flex; gap: 6px; margin-bottom: 5px; }
  .tools select { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 6px; }
  .tools button { flex: none; font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 8px; background: #495057; }
  .tools button.on { background: #2b8a3e; }
  .cam.empty { background: transparent; border-style: dashed; }
  .cam.empty .pic { background: transparent; }
  .muted { color: var(--muted); }
  .err { color: var(--err); }
  #take { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 14px; font-size: 14px; word-break: break-word; }
  #take[hidden], [hidden] { display: none !important; }
  .details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 6px; margin-top: 12px; }
  .details h2 { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
  .details label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 9px; }
  .details input { display: block; width: 100%; margin-top: 3px; font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
  .details input:focus { outline: 2px solid #74c0fc; outline-offset: 0; }
  .details input:disabled { opacity: 0.6; }
  .details input.missing { border-color: var(--err); }
  .details input.missing:focus { outline-color: var(--err); }
  #detailsNote { font-size: 12px; color: var(--muted); min-height: 1.3em; margin-bottom: 4px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Hand Tracker</h1>
  <div id="status">Connecting…</div>
  <section class="details" aria-labelledby="detailsTitle">
    <h2 id="detailsTitle">Take details</h2>
    <label>Contributor <input id="contributor" type="text" maxlength="200" autocomplete="off" enterkeyhint="next" required /></label>
    <label>Location <input id="location" type="text" maxlength="200" autocomplete="off" enterkeyhint="next" required /></label>
    <label>Task <input id="task" type="text" maxlength="200" autocomplete="off" enterkeyhint="done" required /></label>
    <div id="detailsNote"></div>
  </section>
  <div class="controls">
    <button id="camsBtn" hidden>Start cameras</button>
    <button id="recBtn" class="record" disabled>Start recording</button>
    <button id="offBtn" class="stop" hidden>Stop cameras</button>
  </div>
  <div id="message"></div>
  <div id="grid" class="grid"></div>
  <div id="take" hidden></div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const KEY_NAME = "hand-tracker-remote-key";
  // The key from the QR code's address (#k=…), kept for next time and taken out of the address bar.
  let key = "";
  const fromHash = /[#&]k=([A-Za-z0-9_-]{8,64})/.exec(location.hash);
  try {
    if (fromHash) localStorage.setItem(KEY_NAME, fromHash[1]);
    key = fromHash ? fromHash[1] : localStorage.getItem(KEY_NAME) || "";
  } catch {
    key = fromHash ? fromHash[1] : "";
  }
  if (fromHash) history.replaceState(null, "", location.pathname);

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const api = async (path, opts = {}) => {
    const res = await fetch(path, { ...opts, cache: "no-store", headers: { ...(opts.headers || {}), "X-Key": key } });
    if (res.status === 401) throw Object.assign(new Error("key"), { auth: true });
    return res;
  };
  const clock = (s) => {
    s = Math.max(0, Math.floor(s || 0));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = String(s % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
  };
  // What a button did; it goes after a few seconds (the status line says how things are).
  let sayTimer = null;
  const say = (text, err = false) => {
    clearTimeout(sayTimer);
    $("message").textContent = text || "";
    $("message").className = err ? "err" : "";
    if (text && !err) sayTimer = setTimeout(() => say(""), 5000);
  };

  let state = null, sending = false, shownCams = -1;
  const loops = [];

  // ---------- take details: kept by Hand Tracker (every phone sees the same), sent as typed ----------
  const FIELDS = ["contributor", "location", "task"];
  const LABELS = { contributor: "Contributor", location: "Location", task: "Task" };
  const NOTE = "All three are needed to start recording. Each take is named after them and its length, and keeps them in its file.";
  const LOCKED_NOTE = "Locked: this take is named after these, and they can't be changed for it.";
  let edits = 0, sentEdits = 0, detailsTimer = null, locked = false;
  // From Start recording until the take is saved the details are the take's (Hand Tracker says
  // so); the camera previews and controls stay as they are.
  function lockDetails(on) {
    if (on === locked) return;
    locked = on;
    FIELDS.forEach((k) => {
      $(k).disabled = on;
      if (on) $(k).classList.remove("missing");
    });
    $("detailsNote").textContent = on ? LOCKED_NOTE : NOTE;
  }
  $("detailsNote").textContent = NOTE;
  const readDetails = () => Object.fromEntries(FIELDS.map((k) => [k, $(k).value.trim()]));
  // All three are needed to start recording: the empty ones are marked, and the first gets the cursor.
  function markMissing(missing) {
    FIELDS.forEach((k) => $(k).classList.toggle("missing", missing.includes(k)));
    if (missing.length) $(missing[0]).focus();
    const words = missing.map((k) => LABELS[k]);
    return words.length > 1 ? `${words.slice(0, -1).join(", ")} and ${words[words.length - 1]}` : words[0] || "";
  }
  // Hand Tracker's details into the boxes, except while some are typed and not yet sent.
  function fillDetails(d) {
    if (!d || edits !== sentEdits) return;
    for (const k of FIELDS) if (document.activeElement !== $(k) && $(k).value !== (d[k] || "")) $(k).value = d[k] || "";
  }
  async function sendDetails() {
    clearTimeout(detailsTimer);
    if (edits === sentEdits) return true;
    const upTo = edits;
    try {
      const res = await (await api("/api/command", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "details", details: readDetails() }) })).json().catch(() => ({}));
      sentEdits = upTo;
      // A take started meanwhile (from another phone, say): it keeps its details, which come back here.
      if (res.locked) {
        lockDetails(true);
        return true;
      }
      if (edits === sentEdits && !locked) $("detailsNote").textContent = "Saved: the next take is named after these.";
      return true;
    } catch {
      $("detailsNote").textContent = "Not saved yet: can't reach Hand Tracker.";
      return false;
    }
  }
  FIELDS.forEach((k, i) => {
    $(k).addEventListener("input", () => {
      if ($(k).value.trim()) $(k).classList.remove("missing");
      if (!FIELDS.some((f) => $(f).classList.contains("missing")) && /^Fill in/.test($("message").textContent)) say("");
      edits++;
      clearTimeout(detailsTimer);
      detailsTimer = setTimeout(sendDetails, 700);
    });
    $(k).addEventListener("change", sendDetails);
    $(k).addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      if (FIELDS[i + 1]) $(FIELDS[i + 1]).focus();
      else $(k).blur();
    });
  });

  function render() {
    const s = state;
    $("title").textContent = s.host ? `Hand Tracker on ${s.host}` : "Hand Tracker";
    document.title = s.recording ? `● ${clock(s.elapsed_s)} · Hand Tracker` : "Hand Tracker remote";
    const cams = s.cameras || [];
    const running = cams.filter((c) => c.fps > 0).length;
    const status = $("status");
    status.className = s.recording ? "rec" : "";
    if (s.recording) status.innerHTML = `<span class="dot"></span>Recording ${clock(s.elapsed_s)}`;
    else if (s.pending) status.textContent = s.pending;
    else if (!s.running) status.textContent = s.savedCameras ? `Cameras off. Start cameras starts the ${s.savedCameras} picked on Hand Tracker.` : "Cameras off.";
    else if (running < cams.length) status.textContent = `Starting cameras… ${running} of ${cams.length} running`;
    else status.textContent = `${cams.length} camera${cams.length === 1 ? "" : "s"} running`;

    $("camsBtn").hidden = !!(s.running || s.recording);
    $("camsBtn").disabled = sending || !!s.pending;
    $("offBtn").hidden = !s.running || !!s.recording;
    $("offBtn").disabled = sending || !!s.pending;
    const rec = $("recBtn");
    rec.textContent = s.recording ? "Stop recording" : "Start recording";
    rec.className = s.recording ? "stop" : "record";
    rec.disabled = sending || (!!s.pending && !s.recording);

    if (cams.length !== shownCams) buildGrid(cams.length);
    const { slots, empty } = blocks(cams.map((c) => c.roleId));
    cams.forEach((c, i) => {
      const box = $(`cam${i}`);
      if (!box) return;
      box.style.order = slots[i];
      const what = c.error ? `<span class="err">${esc(c.error)}</span>` : c.fps > 0 ? `${c.fps} fps · ${c.hands && c.hands.length ? esc(c.hands.join(" + ")) : "no hands"}` : '<span class="muted">starting…</span>';
      box.querySelector(".what").innerHTML = `<span class="muted">${esc(c.label || c.name)}</span><br />${what}`;
      const role = box.querySelector("select");
      if (document.activeElement !== role) role.value = c.roleId || "";
      box.querySelector(".rot").textContent = `⟳ ${c.rotation || 0}°`;
      const flip = box.querySelector(".flip");
      flip.classList.toggle("on", !!c.mirror);
      flip.setAttribute("aria-pressed", String(!!c.mirror));
    });
    ROLES.forEach((r, b) => {
      const el = $(`empty${b}`);
      if (el) el.hidden = !empty.includes(b);
    });
    lockDetails(!!s.detailsLocked);
    fillDetails(s.details);

    const t = s.lastTake;
    $("take").hidden = !t;
    const named = t && t.details ? ["task", "contributor", "location"].map((k) => t.details[k]).filter(Boolean).join(" · ") : "";
    if (t) $("take").innerHTML = t.ok
      ? `Last take: ${clock(t.duration)} · ${t.hands} hand${t.hands === 1 ? "" : "s"}${named ? ` · ${esc(named)}` : ""}, saved on ${esc(s.host || "the computer")} as <b>${esc((t.files || []).join(", "))}</b><br /><span class="muted">${esc(t.dir || "")}</span>`
      : `Last take: <span class="err">${esc(t.message || "not saved")}</span>`;
  }

  // The 2 × 2 grid by role, as in Hand Tracker: head top left, chest top right, left wrist bottom
  // left, right wrist bottom right; a camera with no role takes the first free block.
  const ROLES = [["head", "Head"], ["chest", "Chest"], ["wrist_left", "Left wrist"], ["wrist_right", "Right wrist"]];
  function blocks(roles) {
    const ids = ROLES.map((r) => r[0]);
    const slots = roles.map((r) => ids.indexOf(r));
    const used = new Set(slots.filter((b) => b >= 0));
    slots.forEach((b, i) => {
      if (b >= 0) return;
      const free = ids.findIndex((_, k) => !used.has(k));
      slots[i] = free >= 0 ? free : ids.length + i;
      if (free >= 0) used.add(free);
    });
    return { slots, empty: ids.map((_, k) => k).filter((k) => !used.has(k)) };
  }
  const roleOptions = `<option value="">No role</option>` + ROLES.map(([id, label]) => `<option value="${id}">${label}</option>`).join("");
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  // A box per running camera (only those: Hand Tracker starts only the cameras plugged in),
  // each with its own preview loop (a few pictures a second, only while this page is visible:
  // the computer makes previews only while they're asked for), its role, turn and flip. The
  // blocks no camera has say so.
  function buildGrid(n) {
    shownCams = n;
    loops.forEach((l) => (l.stop = true));
    loops.length = 0;
    const cams = Array.from({ length: n }, (_, i) =>
      `<div class="cam" id="cam${i}"><div class="pic"><span>No picture yet</span><img alt="" hidden /></div>` +
      `<div class="cap"><div class="tools"><select data-i="${i}" aria-label="Role">${roleOptions}</select>` +
      `<button type="button" class="rot" data-i="${i}" aria-label="Turn 90 degrees clockwise"></button>` +
      `<button type="button" class="flip" data-i="${i}" aria-pressed="false">Flip</button></div><div class="what"></div></div></div>`);
    const holes = n ? ROLES.map(([, label], b) => `<div class="cam empty" id="empty${b}" style="order:${b}" hidden><div class="pic"><span>${label}: no camera</span></div></div>`) : [];
    $("grid").innerHTML = cams.join("") + holes.join("");
    for (let i = 0; i < n; i++) {
      const loop = { stop: false };
      loops.push(loop);
      previewLoop(i, loop);
    }
  }
  // A camera's role, turn or flip, from its box.
  $("grid").addEventListener("change", (e) => {
    if (e.target.matches("select")) command("camera", { camera: { index: Number(e.target.dataset.i), role: e.target.value } });
  });
  $("grid").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    const c = b && state && (state.cameras || [])[Number(b.dataset.i)];
    if (!c) return;
    if (b.matches(".rot")) command("camera", { camera: { index: c.index, rotation: ((c.rotation || 0) + 90) % 360 } });
    else if (b.matches(".flip")) command("camera", { camera: { index: c.index, mirror: !c.mirror } });
  });
  async function previewLoop(i, loop) {
    const img = document.querySelector(`#cam${i} img`), note = document.querySelector(`#cam${i} .pic span`);
    let url = null;
    while (!loop.stop) {
      if (document.hidden) {
        await sleep(500);
        continue;
      }
      try {
        const res = await api(`/api/preview?i=${i}`);
        if (res.status === 200) {
          const next = URL.createObjectURL(await res.blob());
          await new Promise((r) => { img.onload = img.onerror = r; img.src = next; });
          if (url) URL.revokeObjectURL(url);
          url = next;
          img.hidden = false;
          note.hidden = true;
          await sleep(200);
        } else {
          await sleep(700);
        }
      } catch {
        await sleep(1500);
      }
    }
    if (url) URL.revokeObjectURL(url);
  }

  async function poll() {
    for (;;) {
      try {
        state = await (await api("/api/state")).json();
        render();
        if ($("message").className === "err" && /reach|key/.test($("message").textContent)) say("");
      } catch (err) {
        say(err.auth
          ? "This page needs Hand Tracker's code: open it over Tailscale, or scan the QR code under Remote recording in Hand Tracker."
          : "Can't reach Hand Tracker. Is it still running, with Remote recording on, and is this phone on the same network (or on Tailscale)?", true);
      }
      await sleep(document.hidden ? 3000 : 1000);
    }
  }

  // extra: a camera's settings ({ camera }). Details being typed go first, so a take that's
  // stopped (or started) has them.
  async function command(action, extra = {}) {
    sending = true;
    if (state) render();
    try {
      await sendDetails();
      const res = await (await api("/api/command", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, ...extra }) })).json();
      if (Array.isArray(res.missing)) markMissing(res.missing.filter((k) => FIELDS.includes(k)));
      say(res.message || (res.ok ? "" : res.error || "That didn't work."), res.ok === false || !!res.error);
    } catch (err) {
      say(err.auth ? "This page's code isn't Hand Tracker's any more: scan the QR code again." : "Can't reach Hand Tracker.", true);
    } finally {
      sending = false;
      try {
        state = await (await api("/api/state")).json();
        render();
      } catch {}
    }
  }
  $("camsBtn").addEventListener("click", () => command("cameras"));
  $("offBtn").addEventListener("click", () => command("close"));
  $("recBtn").addEventListener("click", () => {
    if (state && state.recording) return command("stop");
    // Hand Tracker checks too (for every phone), but there's no need to ask it.
    const d = readDetails();
    const missing = FIELDS.filter((k) => !d[k]);
    if (missing.length) return say(`Fill in ${markMissing(missing)} first: each take is named after them.`, true);
    command("record");
  });
  poll();
})();
</script>
</body>
</html>
